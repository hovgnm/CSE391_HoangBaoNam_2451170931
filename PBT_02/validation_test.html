<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>A2 - Validation Test</title>
</head>
<body>

<h2>Câu A2 - Kiểm tra Validation</h2>

<form action="">

    <p>Trường hợp 1 - required, để trống:</p>
    <input type="text" required value="">

    <p>Trường hợp 2 - type email, gõ "abc":</p>
    <input type="email" value="abc">

    <p>Trường hợp 3 - number min=1 max=10, gõ 15:</p>
    <input type="number" min="1" max="10" value="15">

    <p>Trường hợp 4 - pattern 10 chữ số, gõ "abc123":</p>
    <input type="text" pattern="[0-9]{10}" title="Phải nhập đúng 10 chữ số" value="abc123">

    <p>Trường hợp 5 - password minlength=8, gõ "123":</p>
    <input type="password" required minlength="8" value="123">

    <br><br>
    <button type="submit">Submit</button>

</form>

</body>
</html>
