<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="form_validator.css" />
  </head>
  <body>
    <div class="container">
      <h2>Đăng ký tài khoản</h2>
      <form id="registerForm">
        <div class="form-group">
          <label>Họ tên</label>
          <input type="text" id="name" placeholder="Nhập họ tên" />
          <span class="msg" id="nameMsg"></span>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="text" id="email" placeholder="Nhập email" />
          <span class="msg" id="emailMsg"></span>
        </div>

        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="Nhập mật khẩu" />
          <div class="strength-bar">
            <div id="strengthFill"></div>
          </div>
          <span class="msg" id="passwordMsg"></span>
        </div>

        <div class="form-group">
          <label>Xác nhận mật khẩu</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Nhập lại mật khẩu"
          />
          <span class="msg" id="confirmMsg"></span>
        </div>

        <div class="form-group">
          <label>Số điện thoại</label>
          <input
            type="text"
            id="phone"
            placeholder="0901234567"
            maxlength="12"
          />
          <span class="msg" id="phoneMsg"></span>
        </div>

        <button type="submit" id="submitBtn" disabled>Đăng ký</button>
      </form>
    </div>

    <!-- Modal thành công -->
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h3>🎉 Đăng ký thành công!</h3>
        <p id="modalInfo"></p>
        <button
          onclick="document.getElementById('modal').classList.add('hidden')"
        >
          Đóng
        </button>
      </div>
    </div>

    <script src="form_validator.js"></script>
  </body>
</html>
