<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài B2 - Flexbox</title>
    <link rel="stylesheet" href="flexbox.css" />
  </head>
  <body>
    <!-- PHẦN 1: NAVBAR -->
    <nav class="navbar">
      <div class="nav-logo">🛒 ShopVN</div>

      <ul class="nav-menu">
        <li><a href="#">Trang chủ</a></li>
        <li><a href="#">Sản phẩm</a></li>
        <li><a href="#">Về chúng tôi</a></li>
      </ul>

      <div class="nav-buttons">
        <button class="btn-login">Đăng nhập</button>
        <button class="btn-register">Đăng ký</button>
      </div>
    </nav>

    <!-- PHẦN 2: PRODUCT CARDS -->
    <div class="container">
      <h2>Sản phẩm</h2>

      <div class="card-list">
        <div class="card">
          <img src="https://via.placeholder.com/250x160" alt="sp1" />
          <div class="card-body">
            <h4>Áo thun cổ tròn</h4>
            <p class="price">120.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img src="https://via.placeholder.com/250x160" alt="sp2" />
          <div class="card-body">
            <h4>Quần short kaki</h4>
            <p class="price">220.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img src="https://via.placeholder.com/250x160" alt="sp3" />
          <div class="card-body">
            <h4>Giày thể thao trắng</h4>
            <p class="price">450.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img src="https://via.placeholder.com/250x160" alt="sp4" />
          <div class="card-body">
            <h4>Túi đeo chéo</h4>
            <p class="price">180.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img src="https://via.placeholder.com/250x160" alt="sp5" />
          <div class="card-body">
            <h4>Mũ lưỡi trai</h4>
            <p class="price">95.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img src="https://via.placeholder.com/250x160" alt="sp6" />
          <div class="card-body">
            <h4>Áo khoác dù</h4>
            <p class="price">380.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img src="https://via.placeholder.com/250x160" alt="sp7" />
          <div class="card-body">
            <h4>Dép sandal</h4>
            <p class="price">130.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img src="https://via.placeholder.com/250x160" alt="sp8" />
          <div class="card-body">
            <h4>Đồng hồ đeo tay</h4>
            <p class="price">750.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>
      </div>
    </div>
  </body>
</html>
